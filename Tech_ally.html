<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Технологии альянса | Ant Legion Mini</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #ff6b81;
      --success: #51cf66;
      --warning: #fdcb6e;
      --tech-locked: rgba(100, 100, 100, 0.4);
      --tech-unlocked: rgba(79, 175, 249, 0.2);
    }
    body {
      background: var(--bg);
      color: white;
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .title {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .stat-label {
      font-size: 0.75rem;
      color: #aaa;
      text-transform: uppercase;
    }
    .stat-value {
      font-weight: 700;
      font-size: 1.1rem;
    }

    /* Сетка технологий */
    .tech-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 16px;
    }
    .tech-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.2s;
    }
    .tech-card:hover:not(.locked) {
      transform: translateY(-3px);
      border-color: var(--accent);
    }
    .tech-title {
      font-weight: 700;
      margin-bottom: 6px;
    }
    .tech-desc {
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .tech-cost {
      font-size: 0.9rem;
      color: var(--warning);
      font-weight: 700;
    }
    .tech-status {
      position: absolute;
      bottom: 10px;
      right: 10px;
      font-size: 0.85rem;
    }
    .status-unlocked {
      color: var(--success);
    }
    .status-locked {
      color: #666;
    }

    .locked {
      opacity: 0.6;
      filter: grayscale(1);
      cursor: not-allowed;
    }
    .unlocked {
      filter: none;
      opacity: 1;
    }

    .log-area {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      height: 130px;
      overflow-y: auto;
      color: #ccc;
      font-size: 0.9rem;
      margin-top: 24px;
    }
    .log-line {
      margin-bottom: 4px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .nav-bar {
      position: fixed;
      bottom: 16px;
      width: calc(100% - 32px);
      max-width: 640px;
      left: 16px;
      display: flex;
      gap: 12px;
    }
    .nav-btn {
      flex: 1;
      background: rgba(0,0,0,0.6);
      border: 1px solid var(--border);
      color: white;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
    }
    .nav-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <h2 class="title">🧬 Технологии альянса</h2>
    <span style="font-size:0.9rem; color:#aaa;">Ник: ArtPlayHD</span>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Вклад в альянс</div>
      <div class="stat-value" id="ally-contribution">0%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Ранг</div>
      <div id="player-rank" class="rank-badge" style="padding:4px 8px; border-radius:6px; font-weight:700;">Новичок</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Мощь альянса</div>
      <div class="stat-value" id="ally-power">0B</div>
    </div>
  </div>

  <h3 style="color:#4facf9; text-transform:uppercase; border-bottom:1px solid var(--border); padding-bottom:6px;">Дерево технологий</h3>
  <p style="color:#aaa; font-size:0.9rem;">Технологии дают бонусы к ресурсам, защите и мощи. Открываются по рангу и вкладу.</p>

  <div class="tech-grid" id="tech-grid">
    <!-- Карточки технологий добавляются через JS -->
  </div>

  <div class="log-area" id="log-area"></div>

  <!-- Навигация -->
  <div class="nav-bar">
    <a href="Alans.html" class="nav-btn">Альянс</a>
    <a href="ant_house.html" class="nav-btn">Муравейник</a>
  </div>

  <script src="Tech_ally_logyc.js"></script>
</body>
</html>
